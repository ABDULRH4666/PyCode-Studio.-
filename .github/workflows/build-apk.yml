name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer "cython<3"

      - name: Cache buildozer data
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-v3-${{ hashFiles('buildozer.spec') }}

      - name: Build debug APK
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: Show the real error
        if: failure()
        run: |
          echo "=== What went wrong ==="
          grep -n -A25 "What went wrong" build.log | head -80 || true
          echo "=== Lines with error ==="
          grep -n -i -E "FAILURE:|error:|Exception|Could not" build.log | tail -40 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PyCodeStudio-apk
          path: bin/*.apk
